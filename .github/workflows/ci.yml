# Validates Quote Library from a clean checkout on every push and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node scripts/detect-desktop-dependencies.mjs
      - run: node scripts/validate-version.mjs 1.2.1
      - name: Reject tracked ignored artifacts
        run: test -z "$(git ls-files main.js data.json .obsidian node_modules '*.map' '*.bak' '*.tmp')"
